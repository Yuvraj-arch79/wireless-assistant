name: Conversation live check
# Real Hinglish multi-turn run through the HTTP API with the repository's free-tier secrets.
# Results go to a throw-away branch ci/live-results-<run id> (they include source passage text
# for human verification, so they are kept out of feature branches and main).
on:
  workflow_dispatch:
    inputs:
      cases:
        description: Optional comma-separated case IDs from evaluation/conversation_live.py
        type: string
        required: false
  push:
    branches: ['fix/**']
    paths: ['.github/live-trigger']
permissions:
  contents: write
concurrency:
  group: provider-readiness
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      WA_FREE_TIER_CONFIRMED: ${{ vars.WA_GEMINI_FREE_TIER_CONFIRMED || '1' }}
      WA_GROQ_FREE_TIER_CONFIRMED: ${{ vars.WA_GROQ_FREE_TIER_CONFIRMED || '1' }}
      WA_OPENROUTER_FREE_TIER_CONFIRMED: ${{ vars.WA_OPENROUTER_FREE_TIER_CONFIRMED || '1' }}
      WA_EVAL_CASES: ${{ inputs.cases || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Initialize tokenizer outside request deadline
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_harmony')"
        timeout-minutes: 1
      - name: Prepare and verify the pinned TS 38.201 index (sample citations checked before activation)
        id: prepare
        continue-on-error: true
        run: python -m wireless_assistant.cli prepare-one
      - name: Live conversations
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: python -m evaluation.conversation_live
      - name: Publish results to a throw-away branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/results
          cp data/one-pdf/preparation.json /tmp/results/ 2>/dev/null || true
          cp data/one-pdf/conversation-report.json /tmp/results/ 2>/dev/null || echo '{"status":"no_report"}' > /tmp/results/conversation-report.json
          cp data/one-pdf/logs/runs.jsonl /tmp/results/ 2>/dev/null || true
          echo "${{ github.sha }} prepare=${{ steps.prepare.outcome }}" > /tmp/results/source-commit.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898237+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan "ci/live-results-${{ github.run_id }}"
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/results/* .
          git add -A && git commit -qm "Live conversation results for ${{ github.sha }}"
          git push origin "HEAD:refs/heads/ci/live-results-${{ github.run_id }}"
