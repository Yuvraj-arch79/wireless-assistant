name: Full corpus prerequisite
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['evaluation/embedding_check.py', '.github/workflows/full-corpus-check.yml']
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-corpus]')) && 'provider-readiness' || github.run_id }}
  cancel-in-progress: false
jobs:
  embedding:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-corpus]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: One real embedding batch, no retries
        run: python -m evaluation.embedding_check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WA_FREE_TIER_CONFIRMED: ${{ vars.WA_GEMINI_FREE_TIER_CONFIRMED || '1' }}
