name: One PDF live validation
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Prior run ID containing this repository's one-pdf-validation artifact (optional)
        type: string
        required: false
  push:
    branches: [main]
    paths: ['wireless_assistant/one_pdf.py', 'evaluation/one_pdf_live.py', '.github/workflows/one-pdf-check.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[one-pdf]')) && 'provider-readiness' || github.run_id }}
  cancel-in-progress: false
jobs:
  embedding:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[one-pdf]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Restore previously completed public corpus batches
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: one-pdf-validation
          path: data/one-pdf/
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare the complete pinned TS 38.201 PDF
        run: python -m wireless_assistant.cli prepare-one
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WA_FREE_TIER_CONFIRMED: ${{ vars.WA_GEMINI_FREE_TIER_CONFIRMED || '1' }}
      - name: Four source-anchored live A-B-C checks
        run: python -m evaluation.one_pdf_live
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WA_FREE_TIER_CONFIRMED: ${{ vars.WA_GEMINI_FREE_TIER_CONFIRMED || '1' }}
          WA_GROQ_FREE_TIER_CONFIRMED: ${{ vars.WA_GROQ_FREE_TIER_CONFIRMED || '1' }}
          WA_OPENROUTER_FREE_TIER_CONFIRMED: ${{ vars.WA_OPENROUTER_FREE_TIER_CONFIRMED || '1' }}
      - name: Preserve public corpus progress and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: one-pdf-validation
          path: data/one-pdf/
          retention-days: 7
          if-no-files-found: warn
