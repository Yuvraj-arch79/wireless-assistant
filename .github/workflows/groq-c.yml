name: Groq C evaluation
on:
  workflow_dispatch:
    inputs:
      cases:
        description: Space-separated C cases (omit to run the bounded six-case suite)
        type: string
        default: correct contradicted unsupported partial regression injection
  push:
    branches: [main]
    paths: ['evaluation/groq_c.py', '.github/workflows/groq-c.yml']
permissions:
  contents: read
concurrency:
  group: provider-readiness
  cancel-in-progress: false
jobs:
  c-evaluation:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[groq-c]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - name: Six bounded C cases, stop on first failure
        shell: bash
        run: |
          read -r -a cases <<< "$WA_C_CASES"
          python -m evaluation.groq_c --cases "${cases[@]}"
        env:
          WA_C_CASES: ${{ inputs.cases || 'correct contradicted unsupported partial regression injection' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Owner authorized this bounded C test on the existing free Groq account.
          # Explicit 0 revokes; the runner does not inspect account billing.
          WA_GROQ_FREE_TIER_CONFIRMED: ${{ vars.WA_GROQ_FREE_TIER_CONFIRMED || '1' }}
