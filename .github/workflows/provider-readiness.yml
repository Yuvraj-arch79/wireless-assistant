name: Provider readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evaluation/providers.py'
      - 'evaluation/readiness.py'
      - '.github/workflows/provider-readiness.yml'
permissions:
  contents: read
concurrency:
  group: provider-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python evaluation/validate.py
      - name: Metadata access and optional free-only A smoke
        run: python -m evaluation.readiness
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          WA_FREE_TIER_CONFIRMED: ${{ vars.WA_FREE_TIER_CONFIRMED }}
          WA_EVAL_GEMINI_MODEL: ${{ vars.WA_EVAL_GEMINI_MODEL }}
          WA_EVAL_GROQ_MODEL: ${{ vars.WA_EVAL_GROQ_MODEL }}
          WA_EVAL_MISTRAL_MODEL: ${{ vars.WA_EVAL_MISTRAL_MODEL }}
