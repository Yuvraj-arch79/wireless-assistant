name: Provider readiness
# Explicit bounded Groq contract check requested by owner, 3 November 2026.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Normal readiness or explicit bounded Gemini diagnosis
        type: choice
        options: [single, contract, readiness, diagnostic]
        default: single
      provider:
        description: Provider to test (confirmation is scoped to each provider)
        type: choice
        options: [gemini, groq, mistral, all]
        default: groq
  push:
    branches: [main]
    paths:
      - 'evaluation/providers.py'
      - 'evaluation/readiness.py'
      - 'evaluation/gemini_diagnostic.py'
      - 'evaluation/groq_contract.py'
      - '.github/workflows/provider-readiness.yml'
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[groq-smoke]')) && 'provider-readiness' || github.run_id }}
  cancel-in-progress: false
jobs:
  readiness:
    # API calls require an explicit manual run or an owner-authorized commit marker.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[groq-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python evaluation/validate.py
      - name: Metadata access and optional free-only A smoke
        shell: bash
        run: |
          if [ "$WA_EVAL_MODE" = "single" ]; then
            python -m evaluation.readiness --provider "$WA_EVAL_PROVIDER" --generation-only
          elif [ "$WA_EVAL_MODE" = "contract" ] && [ "$WA_EVAL_PROVIDER" = "groq" ]; then
            python -m evaluation.groq_contract --strict-only
          elif [ "$WA_EVAL_PROVIDER" = "gemini" ] && [ "$WA_EVAL_MODE" = "diagnostic" ]; then
            python -m evaluation.gemini_diagnostic
          else
            python -m evaluation.readiness --provider "$WA_EVAL_PROVIDER"
          fi
        env:
          WA_EVAL_MODE: ${{ inputs.mode || 'contract' }}
          WA_EVAL_PROVIDER: ${{ inputs.provider || 'groq' }}
          GEMINI_API_KEY: ${{ (inputs.provider == 'gemini' || inputs.provider == 'all') && secrets.GEMINI_API_KEY || '' }}
          GROQ_API_KEY: ${{ (inputs.provider == '' || inputs.provider == 'groq' || inputs.provider == 'all') && secrets.GROQ_API_KEY || '' }}
          MISTRAL_API_KEY: ${{ (inputs.provider == 'mistral' || inputs.provider == 'all') && secrets.MISTRAL_API_KEY || '' }}
          # Owner confirmed Gemini Free tier on 2 November 2026. Set variable to 0 to revoke.
          WA_GEMINI_FREE_TIER_CONFIRMED: ${{ vars.WA_GEMINI_FREE_TIER_CONFIRMED || '1' }}
          # Explicit owner request: one strict-schema diagnostic call under the project's free-only constraint.
          # This bounded invocation is not a billing inspection or blanket account confirmation.
          WA_GROQ_FREE_TIER_CONFIRMED: ${{ vars.WA_GROQ_FREE_TIER_CONFIRMED || (github.event_name == 'push' && contains(github.event.head_commit.message, '[groq-smoke]') && '1') || '' }}
          WA_MISTRAL_FREE_TIER_CONFIRMED: ${{ vars.WA_MISTRAL_FREE_TIER_CONFIRMED }}
          WA_EVAL_GEMINI_MODEL: ${{ vars.WA_EVAL_GEMINI_MODEL }}
          WA_EVAL_GROQ_MODEL: ${{ vars.WA_EVAL_GROQ_MODEL }}
          WA_EVAL_MISTRAL_MODEL: ${{ vars.WA_EVAL_MISTRAL_MODEL }}
