name: OpenRouter B evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['evaluation/openrouter_b.py', '.github/workflows/openrouter-b.yml']
permissions:
  contents: read
concurrency:
  group: openrouter-b-evaluation
  cancel-in-progress: false
jobs:
  b-evaluation:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[openrouter-b]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m evaluation.openrouter_b
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
