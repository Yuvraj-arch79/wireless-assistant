[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-assistant"
version = "0.1.0"
description = "Local 3GPP evidence assistant with bounded A/B/C orchestration"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "pydantic==2.14.2", "pdfplumber==0.11.10"]

[project.scripts]
wireless-assistant = "wireless_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["wireless_assistant*", "scripts*"]

[tool.setuptools.package-data]
wireless_assistant = ["static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
